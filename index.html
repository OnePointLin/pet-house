<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4A340">
<meta name="description" content="家事任務養寵物：家人互相派任務、賺金幣、買飼料和裝扮，一起養大寵物。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="寵物樂園">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>家事寵物樂園</title>
<style>
:root{--bg:#FFF8EC;--card:#fff;--tx:#3B2A1A;--sub:#8a7358;--line:#EADFC8;--pri:#F4A340;--ok:#4E9F6E;--no:#E24B4A}
@media(prefers-color-scheme:dark){:root{--bg:#1d1a16;--card:#2a2620;--tx:#f3eadb;--sub:#b5a48a;--line:#41392d}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:12px 16px 40px;width:100%}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:1.25rem;margin:0}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.95rem}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--pri);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700}
.ic{display:inline-block;vertical-align:-.2em;flex:none}
h1{display:flex;align-items:center;gap:8px}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
button.no{background:var(--no);border-color:var(--no);color:#fff;font-weight:700}
button:disabled{opacity:.6}
input,select,textarea{font:inherit;width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx)}
textarea{resize:vertical}
label{display:block;margin-bottom:12px;font-size:.9rem;color:var(--sub)}
label input,label select,label textarea{margin-top:4px;color:var(--tx)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;overflow-wrap:anywhere}
.card.self-task{border:2px solid #378ADD;background:#F0F6FC;}
@media(prefers-color-scheme:dark){.card.self-task{background:#1a2736;}}

.auth{max-width:420px;margin:24px auto}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1 0 auto}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;align-items:start}
.grid .card{margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.meta{color:var(--sub);font-size:.88rem;margin:4px 0}
.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1}
.b{border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;white-space:nowrap;color:#fff;background:var(--sub)}
.b.assigned{background:#378ADD}.b.submitted{background:#E8922A}.b.approved{background:var(--ok)}.b.rejected{background:var(--no)}.b.assignee_rejected{background:#9333EA}
.b.self-badge{background:#1D63B8;margin-left:6px;}
.warn{color:var(--no);font-size:.9rem;margin:4px 0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.9rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.empty{text-align:center;color:var(--sub);padding:24px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:90vw;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}#toast.err{background:var(--no);color:#fff}
.sc svg,.th svg{display:block;width:100%;height:auto}
.th{position:relative;background:#FFF3DC;border-radius:10px;margin-bottom:2px;overflow:hidden}
.ltd{position:absolute;top:6px;left:6px;background:#D4537E;color:#fff;border-radius:999px;padding:1px 9px;font-size:.72rem;font-weight:700;line-height:1.5;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.help ol,.help ul{margin:2px 0 6px;padding-left:1.3em}.help li{margin:6px 0}.help code{background:var(--line);border-radius:6px;padding:1px 6px;font-size:.88em}
.off{position:absolute;top:6px;right:6px;background:#E11D48;color:#fff;border-radius:6px;padding:1px 7px;font-size:.74rem;font-weight:900;line-height:1.5;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.was{color:#9A8C7A;text-decoration:line-through;margin-right:4px}.nowp{color:#E11D48;font-weight:800}
.board{margin:0 0 12px;background:#2A1A3F;color:#fff;border-radius:16px;border:3px solid #3B2A1A;box-shadow:0 3px 0 #3B2A1A;overflow:hidden}
.board .bulb{height:8px;background:radial-gradient(circle,#FFD24A 40%,transparent 45%) 0 0/16px 8px repeat-x}
.board .bin{padding:8px 14px 10px}.board .bhead{display:inline-block;background:#E11D48;color:#fff;font-weight:900;letter-spacing:2px;border-radius:6px;padding:1px 10px;font-size:.8rem;margin-bottom:4px}
.board .brow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:5px 0;border-top:1px dashed rgba(255,255,255,.25)}.board .brow:first-of-type{border-top:0}
.board .bd{color:#FFD24A;font-weight:700}.board .bn{font-weight:900;font-size:1.05rem}.board .bi{color:#E9DFFB}.board .bo{background:#FFD24A;color:#2A1A3F;font-weight:900;border-radius:8px;padding:0 9px}
.foods button:disabled{opacity:.45;cursor:default}
.qty{display:flex;gap:6px;align-items:center;justify-content:center;margin:6px 0 2px}.qty .qn{min-width:2.2em;text-align:center;font-weight:700;font-size:1.05rem}.qty button{flex:0 0 44px;min-width:0;min-height:40px;padding:0;font-size:1.2rem;border-radius:10px;border:2px solid var(--line,#E8D5B8);background:#fff;font-weight:700;cursor:pointer}.qty button:disabled{opacity:.4;cursor:default}
.ltdl{color:#C2410C;font-size:.82rem;margin:2px 0}
.th svg{height:110px}
.sc{border-radius:12px;overflow:hidden}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{display:flex;flex-direction:column;gap:6px;margin:0}.item button{width:100%;padding:0 8px}
.item .row{margin:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;align-items:start}
.two .card{margin:0}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pri);transition:width .4s}
.foods{display:flex;flex-wrap:wrap;gap:8px}.foods button{display:flex;align-items:center;gap:6px;padding:4px 14px 4px 4px}.foods svg{width:48px;height:40px;background:#FFF3DC;border-radius:8px}
.banner{background:var(--pri);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:700;text-align:center;animation:pop .5s}
h3.sec{font-size:1rem;margin:18px 0 8px}
.tabs.sub button{min-height:38px}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
.bob{animation:bob 2.4s ease-in-out infinite}.hop{animation:hop .6s ease infinite}
@media(prefers-reduced-motion:reduce){.bob,.hop,.banner{animation:none}}
#loading{position:fixed;inset:0;background:rgba(60,60,60,.45);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff;font-weight:700;z-index:100;touch-action:none}
#loading.on{display:flex}
.spin{width:44px;height:44px;border:5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
@media(min-width:700px){.wrap{padding:20px 24px 60px}h1{font-size:1.5rem}}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:10px}
.pick{flex-direction:column;height:auto;padding:8px;gap:4px;border:2px solid var(--line);white-space:normal}
.pick.on{border-color:var(--pri);background:#FFF3DC;color:#3B2A1A;font-weight:700}
.pick .th{width:100%;margin:0}.pick .th svg{height:84px}
.grow{display:flex;gap:4px;margin:6px 0 14px}.grow>div{flex:1;min-width:0;text-align:center;font-size:.7rem;color:var(--sub);line-height:1.3}.grow svg{display:block;width:100%;height:auto;background:#FFF3DC;border-radius:8px}
</style>
</head>
<body>
<div class="wrap"><header id="hd"></header><main id="app"><div class="empty">載入中…</div></main></div>
<div id="toast"></div>
<div id="loading" role="status" aria-live="polite"><div class="spin"></div><div>載入中…</div></div>

<!-- 前端設定：後端網址寫在 config.js -->
<script src="config.js"></script>
<script>
  const APP = window.APP_CONFIG || {};
  const API_URL = String(APP.API_URL || '').trim();
  const CFG = {
    showCreateFamily: String(APP.showCreateFamily === undefined ? 'false' : APP.showCreateFamily),   // 開啟後會再向後端 Settings 的 showCreateFamily 確認
    familyCode: String(new URLSearchParams(location.search).get('fc') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12)
  };
</script>

<script>
/* ===== 繪圖模組（支援多種動物與 5 階段） ===== */
const ICON={
 cat:'<path d="M3.5 10.5 L4.8 3.4 L10 6.6 Z M20.5 10.5 L19.2 3.4 L14 6.6 Z" fill="#FFE3B0" stroke="#3B2A1A" stroke-width="1.6"/><ellipse cx="12" cy="13.6" rx="9" ry="7.6" fill="#FFE3B0" stroke="#3B2A1A" stroke-width="1.6"/><circle cx="8.8" cy="12.8" r="1.2" fill="#3B2A1A" stroke="none"/><circle cx="15.2" cy="12.8" r="1.2" fill="#3B2A1A" stroke="none"/><polygon points="10.8,15.2 13.2,15.2 12,16.6" fill="#D4537E" stroke="none"/><path d="M12 16.6v.8M9.8 18c.9.7 3.5.7 4.4 0" stroke="#3B2A1A" stroke-width="1" fill="none"/>',
 task:'<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4h6v3H9z"/><path d="M8.5 12h7M8.5 16h5"/>',
 cart:'<circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2.5 3.5h3l2.3 11h10.9l2-8.2H6.3"/>',
 bag:'<path d="M8.5 7V6a3.5 3.5 0 0 1 7 0v1"/><rect x="5" y="7" width="14" height="14" rx="4.5"/><path d="M9 14h6v4H9z"/>',
 coin:'<circle cx="12" cy="12" r="9.5" fill="#FAC775" stroke="#BA7517" stroke-width="1.6"/><circle cx="12" cy="12" r="6" fill="none" stroke="#BA7517" stroke-width="1.2"/><rect x="11" y="8.2" width="2" height="7.6" rx="1" fill="#BA7517" stroke="none"/>',
 star:'<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z" fill="#FAC775" stroke="#BA7517" stroke-width="1.4"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 left:'<path d="M15 5l-7 7 7 7"/>',
 right:'<path d="M9 5l7 7-7 7"/>',
 help:'<circle cx="12" cy="12" r="9.5"/><path d="M9.4 9.4a2.7 2.7 0 1 1 3.9 2.4c-.9.5-1.3 1.1-1.3 2.1"/><circle cx="12" cy="17.4" r=".7" fill="currentColor"/>',
 key:'<circle cx="8" cy="15.5" r="4"/><path d="M11 12.5l8.5-8.5M16 7.5l3 3M14 9.5l2 2"/>',
 phone:'<rect x="6.5" y="2.5" width="11" height="19" rx="2.8"/><path d="M10.5 18.3h3"/>',
 refresh:'<path d="M20 11.5A8 8 0 1 0 17.7 17"/><path d="M20.5 4v7.5H13"/>'
};
function ic(n,s){s=s||20;return '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>'}
const LV_SCALE={1:[.7,.7],2:[.95,.92],3:[1.23,1.15],4:[1.54,1.4],5:[1.89,1.61],6:[1.89,1.61],7:[1.89,1.61],8:[1.89,1.61],9:[1.89,1.61],10:[1.89,1.61]};
const NOSE='<polygon points="-3.5,-1 3.5,-1 0,3.5" fill="#E56B6B"/>';
const EYE='<circle cx="-14" cy="-8" r="4.5" fill="#3B2A1A"/><circle cx="14" cy="-8" r="4.5" fill="#3B2A1A"/><circle cx="-12.8" cy="-9.4" r="1.5" fill="#fff"/><circle cx="15.2" cy="-9.4" r="1.5" fill="#fff"/>';
const EYEB='<circle cx="-14" cy="-8" r="5.5" fill="#3B2A1A"/><circle cx="14" cy="-8" r="5.5" fill="#3B2A1A"/><circle cx="-12.5" cy="-10" r="2" fill="#fff"/><circle cx="15.5" cy="-10" r="2" fill="#fff"/>';
const ARC='stroke="#3B2A1A" stroke-width="3" fill="none" stroke-linecap="round"';
const BROW='stroke="#3B2A1A" stroke-width="2" stroke-linecap="round"';
const MOUTH='stroke="#6B3E1E" stroke-width="1.5" fill="none" stroke-linecap="round"';

const BODY='<path d="M30 10 Q62 2 56 -26" stroke="#E8922A" stroke-width="9" fill="none" stroke-linecap="round"/><ellipse cx="-18" cy="32" rx="10" ry="6" fill="#E8922A"/><ellipse cx="18" cy="32" rx="10" ry="6" fill="#E8922A"/><ellipse cx="0" cy="0" rx="40" ry="34" fill="#F4A340"/><ellipse cx="0" cy="11" rx="24" ry="18" fill="#FBE3B8"/><polygon points="-35,-16 -31,-50 -9,-30" fill="#F4A340"/><polygon points="35,-16 31,-50 9,-30" fill="#F4A340"/><polygon points="-29,-24 -28,-41 -17,-30" fill="#F4A8A8"/><polygon points="29,-24 28,-41 17,-30" fill="#F4A8A8"/><ellipse cx="-25" cy="3" rx="5" ry="3" fill="#F28B82" opacity=".6"/><ellipse cx="25" cy="3" rx="5" ry="3" fill="#F28B82" opacity=".6"/>';

const FACE={
 normal:EYE+NOSE+'<path d="M-6 7 Q-3 11 0 5 Q3 11 6 7" '+MOUTH+'/>',
 happy:'<path d="M-19 -6 Q-14 -14 -9 -6" '+ARC+'/><path d="M9 -6 Q14 -14 19 -6" '+ARC+'/>'+NOSE+'<path d="M-8 5 Q0 20 8 5 Z" fill="#A32D2D"/><ellipse cx="0" cy="11" rx="4" ry="2.5" fill="#F28B82"/>',
 hungry:EYEB+NOSE+'<ellipse cx="0" cy="10" rx="4" ry="3" fill="#A32D2D"/><path d="M6 12 Q8 17 6 19 Q4 17 6 12 Z" fill="#7ABFEA"/><path d="M-14 25 q3 -4 6 0 t6 0 t6 0" stroke="#B8793A" stroke-width="1.5" fill="none" stroke-linecap="round"/>',
 eating:'<ellipse cx="-26" cy="4" rx="7" ry="5" fill="#F28B82" opacity=".7"/><ellipse cx="26" cy="4" rx="7" ry="5" fill="#F28B82" opacity=".7"/><path d="M-19 -6 Q-14 -14 -9 -6" '+ARC+'/><path d="M9 -6 Q14 -14 19 -6" '+ARC+'/>'+NOSE+'<ellipse cx="0" cy="10" rx="7" ry="5" fill="#A32D2D"/><circle cx="-2" cy="14" r="5.5" fill="#8B5A2B"/><circle cx="11" cy="21" r="1.6" fill="#8B5A2B"/><circle cx="-13" cy="21" r="1.6" fill="#8B5A2B"/>',
 sleepy:'<path d="M-19 -8 Q-14 -3 -9 -8" '+ARC+'/><path d="M9 -8 Q14 -3 19 -8" '+ARC+'/>'+NOSE+'<circle cx="0" cy="9" r="2.2" fill="#A32D2D"/><text x="34" y="-30" font-size="16" font-weight="700" fill="#7F77DD">Z</text><text x="46" y="-44" font-size="12" font-weight="700" fill="#7F77DD">z</text>',
 sad:EYEB+'<path d="M-21 -14 L-9 -19" '+BROW+'/><path d="M21 -14 L9 -19" '+BROW+'/>'+NOSE+'<path d="M-6 11 Q0 4 6 11" '+MOUTH+'/><path d="M-17 0 Q-15 6 -17 9 Q-19 6 -17 0 Z" fill="#7ABFEA"/>'
};

const CAPE_BACK='<path d="M-24 12 L-44 44 L44 44 L24 12 Z" fill="#D4537E"/>';
const ACC={
 party_hat:'<polygon points="-14,-32 14,-32 0,-72" fill="#7F77DD"/><circle cx="0" cy="-74" r="4.5" fill="#FAC775"/><circle cx="-6" cy="-46" r="2.5" fill="#FAC775"/><circle cx="5" cy="-56" r="2.5" fill="#FAC775"/>',
 crown:'<path d="M-17 -30 L-20 -54 L-9 -43 L0 -58 L9 -43 L20 -54 L17 -30 Z" fill="#FAC775" stroke="#BA7517" stroke-width="1.5" stroke-linejoin="round"/><circle cx="0" cy="-37" r="3" fill="#E24B4A"/><circle cx="-9" cy="-35" r="2" fill="#378ADD"/><circle cx="9" cy="-35" r="2" fill="#378ADD"/>',
 straw_hat:'<path d="M-17 -30 Q-17 -54 0 -54 Q17 -54 17 -30 Z" fill="#F0D084"/><ellipse cx="0" cy="-30" rx="32" ry="7" fill="#E8C26A"/><path d="M-17 -33 Q0 -28 17 -33 L17 -38 Q0 -33 -17 -38 Z" fill="#E24B4A"/>',
 bow:'<polygon points="0,22 -12,14 -12,30" fill="#E24B4A"/><polygon points="0,22 12,14 12,30" fill="#E24B4A"/><circle cx="0" cy="22" r="4" fill="#A32D2D"/>',
 bell_collar:'<path d="M-24 17 Q0 28 24 17" stroke="#E24B4A" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="0" cy="27" r="6" fill="#FAC775" stroke="#BA7517" stroke-width="1.5"/><line x1="-3" y1="29" x2="3" y2="29" stroke="#BA7517" stroke-width="1.5"/>',
 scarf:'<path d="M-27 19 Q0 30 27 19 L27 27 Q0 38 -27 27 Z" fill="#3A8FD9"/><path d="M12 29 L18 46 L28 43 L22 26 Z" fill="#2B6DAE"/>',
 round_glasses:'<circle cx="-14" cy="-8" r="10" fill="#fff" fill-opacity=".3" stroke="#3B2A1A" stroke-width="2.5"/><circle cx="14" cy="-8" r="10" fill="#fff" fill-opacity=".3" stroke="#3B2A1A" stroke-width="2.5"/><path d="M-4 -8 L4 -8" stroke="#3B2A1A" stroke-width="2.5"/>',
 sunglasses:'<ellipse cx="-14" cy="-8" rx="11" ry="8" fill="#2C2C2A"/><ellipse cx="14" cy="-8" rx="11" ry="8" fill="#2C2C2A"/><path d="M-3 -9 L3 -9" stroke="#2C2C2A" stroke-width="3"/><path d="M-19 -11 L-13 -11" stroke="#fff" stroke-width="1.5" opacity=".5" stroke-linecap="round"/><path d="M9 -11 L15 -11" stroke="#fff" stroke-width="1.5" opacity=".5" stroke-linecap="round"/>',
 cape:'<path d="M-24 16 Q0 26 24 16" stroke="#993556" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="0" cy="23" r="4.5" fill="#FAC775" stroke="#BA7517" stroke-width="1.5"/>'
};

/* 各動物專屬繪圖：全部共用同一組表情(FACE)與配件(ACC)座標，所以每種動物都有 6 種表情、9 種服裝 */
const WRINKLES='<g stroke="#3B2A1A" stroke-opacity=".42" stroke-width="1.3" fill="none" stroke-linecap="round">'+
 '<path d="M-14 -22 Q-7 -24.5 0 -22 Q7 -24.5 14 -22"/><path d="M-10 -27 Q0 -29.5 10 -27"/><path d="M-6 -32 Q0 -34 6 -32"/>'+
 '<path d="M-23 -9 L-27 -12 M-23 -6 L-28 -6"/><path d="M23 -9 L27 -12 M23 -6 L28 -6"/>'+
 '<path d="M-20 -1 Q-14 3 -8 -1 M-17 3 Q-14 5 -11 3"/><path d="M8 -1 Q14 3 20 -1 M11 3 Q14 5 17 3"/></g>';
function wrapPet(o,back,body,front,noNose){
  const s=o.flat?[1,1]:(LV_SCALE[o.level]||LV_SCALE[1]),acc=o.acc||[];
  let face=FACE[o.mood]||FACE.normal;if(noNose)face=face.split(NOSE).join('');
  return '<g transform="scale('+s[0]+','+s[1]+')">'+(acc.indexOf('cape')>=0?CAPE_BACK:'')+back+body+face+(front||'')+((!o.flat&&(o.level||1)>=10)?WRINKLES:'')+acc.map(function(k){return ACC[k]||''}).join('')+'</g>';
}
function petCat(o){return wrapPet(o,'',BODY)}

  return petCat(o);
}

function sceneSvg(o){
  const S=[38,104,180,256,322], G=[205,205,190,205,205], sc=LV_SCALE[o.level]||LV_SCALE[1];
  let h='<svg viewBox="0 0 360 240" role="img" aria-label="寵物房間">'+(BG[o.bg]||BG.bg_none);
  (o.fur||[]).slice().sort(function(a,b){return a.slot===2?-1:(b.slot===2?1:a.slot-b.slot)}).forEach(function(f){
    if(FUR[f.key]&&S[f.slot]!==undefined)h+='<g transform="translate('+S[f.slot]+','+G[f.slot]+') scale(.8)">'+FUR[f.key]+'</g>';
  });
  const ty=218-39*sc[1];
  h+='<ellipse cx="180" cy="219" rx="'+(40*sc[0]).toFixed(0)+'" ry="5" fill="#000" opacity=".12"/>';
  h+='<g transform="translate(180,'+ty.toFixed(1)+')"><g class="'+(o.cls||'bob')+'">'+pet(o)+'</g></g></svg>';
  return h;
}

function thumb(i){
  const k=i.drawKey, c=i.category;
  if(c==='food')return '<svg viewBox="-50 -80 100 90">'+(FOOD[k]||'')+'</svg>';
  if(c==='furniture')return '<svg viewBox="-60 -92 120 102">'+(FUR[k]||'')+'</svg>';
  if(c==='background')return '<svg viewBox="0 0 360 240">'+(BG[k]||BG.bg_none)+'</svg>';
  return '<svg viewBox="-62 -82 124 130">'+pet({flat:true,mood:'happy',acc:[k]})+'</svg>';
}
function petThumb(type,level,mood){return '<svg viewBox="-84 -76 168 136" role="img">'+'<g transform="scale(1.1)">'+pet({type:type||'cat',flat:true,level:level||3,mood:mood||'happy',acc:[]})+'</g></svg>'}
function growThumb(type,level){return '<svg viewBox="-122 -96 244 160" role="img">'+pet({type:type||'cat',level:level,mood:'happy',acc:[]})+'</svg>'}
</script>
<script>
let P=null,pickedType='cat',shopCat='food',confirmId='',buyQty={},coinList=[],levelMsg='',eatTimer=null,feeding=false,cancelAsk='',taskFilter='all';
const CATN={food:'飼料',costume:'服裝',background:'背景',furniture:'傢具'};
const SLOTN={hat:'帽子',neck:'頸部',face:'臉部',back:'披風'};
const MOOD={normal:'心情平穩',happy:'開心',hungry:'肚子餓了',sleepy:'想睡覺（好久沒來了）',sad:'難過（太久沒餵了）',eating:'吃東西中'};
function item(id){return P.items.find(function(i){return i.itemId===id})}
function invQty(id){const r=P.inv.find(function(i){return i.itemId===id});return r?Number(r.quantity):0}
function keyOf(id){const i=id&&item(id);return i?i.drawKey:''}
function stageOf(lv){return P.levels.find(function(l){return l.level===lv})||P.levels[0]}
async function loadPet(touch){P=await call('petState',{touch:!!touch});me.balance=P.balance}
function sceneOf(){
  const p=P.pet,e=p.equipped;
  return sceneSvg({type:p.type,level:p.level,mood:p.mood,cls:p.mood==='eating'?'hop':'bob',
    acc:[keyOf(e.hat),keyOf(e.neck),keyOf(e.face),keyOf(e.back)].filter(Boolean),
    bg:keyOf(p.backgroundId)||'bg_none',
    fur:P.layout.map(function(l){return {key:keyOf(l.itemId),slot:Number(l.posX)}})});
}
function setP(r){P=r;me.balance=r.balance;fresh.coins=0}

/* ---------- 主畫面結構 ---------- */
function mainHtml(){
  if(!P)return '<div class="empty">載入中…</div>';
  if(!P.pet)return adoptHtml();
  const T=[
    ['pet',ic('cat',18)+' 我的寵物'],
    ['tasks',ic('task',18)+' 任務牆'],
    ['new',ic('task',18)+' 派發任務'],
    ['family',ic('cat',18)+' 家庭寵物牆'],
    ['shop',ic('cart',18)+' 道具商店'],
    ['bag',ic('bag',18)+' 百寶背包'],
    ['coins',ic('coin',18)+' 金幣紀錄']
  ];
  const views={
    pet:petTab,
    tasks:function(){return taskListView()},
    new:newHtml,
    family:familyView,
    shop:shopTab,
    bag:bagTab,
    coins:coinsTab
  };
  return '<div class="tabs">'+T.map(function(x){return '<button class="'+(tab===x[0]?'on':'')+'" onclick="cTab(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div>'+
    (levelMsg?'<div class="banner">'+levelMsg+'</div>':'')+(views[tab]||petTab)();
}
function cTab(t){act(async function(){tab=t;confirmId='';cancelAsk='';if(['tasks','coins','family','new'].indexOf(t)>=0)await ensure(t);render()})}

/* ---------- 領養（可選擇不同動物） ---------- */
const ANIMALS=[
 {k:'cat',n:'貓咪',d:'黏人又愛撒嬌，開心時會瞇起眼睛笑。'},
 {k:'raccoon',n:'浣熊',d:'戴著黑眼罩的小怪盜，機靈又好奇。'},
 {k:'guinea_pig',n:'天竺鼠',d:'圓滾滾軟綿綿，超級療癒。'},
 {k:'lion',n:'獅子',d:'毛茸茸的小獸王，充滿自信。'},
 {k:'parrot',n:'鸚鵡',d:'橘色的小腦袋配上綠色羽毛，色彩繽紛。'},
 {k:'koala',n:'無尾熊',d:'灰灰軟軟的樹熊，總是慢吞吞的很可愛。'}
];
function adoptHtml(){
  const a=ANIMALS.find(function(x){return x.k===pickedType})||ANIMALS[0];
  return '<div class="card auth" style="max-width:520px"><h2 style="text-align:center;font-size:1.1rem;margin:0 0 4px">領養你的第一隻寵物！</h2><div class="meta" style="text-align:center;margin-bottom:10px">先選一種動物，牠長大後會變成什麼樣子，就留給你慢慢發現吧！</div>'+
    '<div class="pickgrid">'+ANIMALS.map(function(x){return '<button type="button" class="pick'+(x.k===pickedType?' on':'')+'" aria-pressed="'+(x.k===pickedType)+'" onclick="pickAnimal(\''+x.k+'\')"><div class="th">'+petThumb(x.k,3,'happy')+'</div><span>'+x.n+'</span></button>'}).join('')+'</div>'+
    '<div class="meta" style="margin-bottom:6px">'+esc(a.d)+'</div>'+
    '<label>幫牠取個好名字<input id="pn2" maxlength="12" value="我的寵物"></label>'+
    '<button class="pri" style="width:100%" onclick="adopt()">確定領養'+esc(a.n)+'（附贈 3 份美味飼料）</button></div>';
}
function pickAnimal(k){const el=$('pn2'),v=el?el.value:'';pickedType=k;render();if($('pn2'))$('pn2').value=v}
function adopt(){act(async function(){setP(await call('adopt',{type:pickedType,name:$('pn2').value||'我的寵物'}));tab='pet';render()})}

/* ---------- 寵物 ---------- */
function saleBoard(){
  if(!P||!P.sales||!P.sales.length)return '';
  return '<div class="board" role="region" aria-label="特價活動"><div class="bulb"></div><div class="bin"><span class="bhead">SALE 特價中</span>'+P.sales.map(function(s){
    const a=md(s.startDate),b=md(s.endDate),d=a&&b?(a===b?a:a+'～'+b):(b?'至 '+b:'自 '+a+' 起');
    return '<div class="brow"><span class="bd">'+d+'</span><span class="bn">'+esc(s.name)+'</span><span class="bi">'+esc(s.catNames.join('、'))+'</span><span class="bo">'+s.discount+'% OFF</span></div>'
  }).join('')+'</div><div class="bulb"></div></div>';
}
function offTag(i){return i.discount>0?'<span class="off">'+i.discount+'% OFF</span>':''}
function priceHtml(i){return i.discount>0?'<span class="was">'+i.price+'</span><span class="nowp">'+i.salePrice+'</span>':String(i.price)}
function petTab(){
  const p=P.pet,lv=stageOf(p.level),next=P.levels.find(function(l){return l.level===p.level+1});
  const pct=next?Math.min(100,Math.round((p.exp-lv.expRequired)/(next.expRequired-lv.expRequired)*100)):100;
  const foods=P.items.filter(function(i){return i.category==='food'&&invQty(i.itemId)>0});
  const fh=foods.length?'<div class="foods">'+foods.map(function(i){return '<button'+(feeding?' disabled':'')+' onclick="feed(\''+i.itemId+'\')">'+thumb(i)+'<span>'+esc(i.name)+' ×'+invQty(i.itemId)+'</span></button>'}).join('')+'</div>':
    '<div class="meta">背包裡沒有飼料了，快去完成任務賺取金幣，再來商店選購吧！</div><button class="pri" onclick="cTab(\'shop\')">前往商店</button>';
  return saleBoard()+'<div class="two"><div class="card sc">'+sceneOf()+'</div><div class="card"><div class="top"><b style="font-size:1.1rem">'+esc(p.name)+'</b><span class="chip">Lv.'+p.level+' '+esc(lv.stageName)+'</span></div>'+
    '<div class="meta">成長經驗 '+p.exp+(next?' / '+next.expRequired:'（已達最高等級）')+'</div><div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="meta">目前體重 '+p.weight+' 公斤 ・ 狀態：'+(MOOD[p.mood]||'')+'</div><div class="meta">今日已餵食 '+P.feedsToday+' / '+P.feedLimit+' 次</div><h3 style="font-size:1rem;margin:12px 0 8px">餵食夥伴</h3>'+fh+'</div></div>';
}
function feed(id){
  if(feeding||!P||!P.pet)return;
  const prevMood=P.pet.mood;
  feeding=true;P.pet.mood='eating';clearTimeout(eatTimer);
  if(tab==='pet'||tab==='bag')render();
  const t0=Date.now();
  const wait=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
  return act(async function(){
    let r;
    try{r=await call('feed',{itemId:id},true)}
    catch(e){feeding=false;if(P&&P.pet)P.pet.mood=prevMood;if(me)render();throw e}
    const left=1500-(Date.now()-t0);if(left>0)await wait(left);
    setP(r);P.pet.mood='happy';feeding=false;
    if(r.fed&&r.fed.leveledUp){levelMsg=ic('star',20)+' 太棒了！'+esc(P.pet.name)+' 升級為 Lv.'+r.fed.newLevel+' '+esc(r.fed.stageName)+'！';setTimeout(function(){levelMsg='';if(me)render()},5000)}
    if(me)render();
  })
}

/* ---------- 商店 ---------- */
function md(d){const m=String(d||'').match(/^\d{4}-(\d{2})-(\d{2})$/);return m?(+m[1])+'/'+(+m[2]):''}
function ltdBadge(i){return i.limited?'<span class="ltd">期間限定</span>':''}
function ltdLine(i){
  if(!i.limited)return '';
  let t=i.availableFrom&&i.availableUntil?'販售期間 '+md(i.availableFrom)+'～'+md(i.availableUntil):(i.availableUntil?'販售至 '+md(i.availableUntil):'自 '+md(i.availableFrom)+' 起販售');
  if(i.daysLeft!==null&&i.daysLeft<=3)t+='・'+(i.daysLeft===0?'今天結束！':'剩 '+(i.daysLeft+1)+' 天');
  return '<div class="ltdl">'+t+'</div>';
}
function shopTab(){
  const cats=Object.keys(CATN);
  return '<div class="tabs sub">'+cats.map(function(c){return '<button class="'+(shopCat===c?'on':'')+'" onclick="shopCat=\''+c+'\';confirmId=\'\';render()">'+CATN[c]+'</button>'}).join('')+'</div>'+
    '<div class="meta" style="margin-bottom:8px">目前擁有金幣：'+ic('coin',16)+' '+P.balance+'</div>'+buyRuleNote()+'<div class="grid4">'+P.items.filter(function(i){return i.category===shopCat&&i.forSale}).map(shopCard).join('')+'</div>';
}
function buyRuleNote(){
  const r=P.buyRule;if(!r||shopCat==='food')return '';
  let t='購買商品可獲得 '+r.exp+' 經驗';
  if(r.every>0){const left=r.every-(r.count%r.every);t+='；每買滿 '+r.every+' 件再加碼 '+r.bonus+' 經驗（已買 '+r.count+' 件，再買 '+left+' 件加碼）'}
  return '<div class="card" style="margin-bottom:10px;padding:10px 14px;background:#FFF1D6;font-size:.92rem">'+t+'</div>';
}
function qtyOf(id){return buyQty[id]||1}
function setQty(id,n){n=Math.max(1,Math.min(10,n));if((buyQty[id]||1)===n)return;buyQty[id]=n;confirmId='';render()}
function shopCard(i){
  const own=invQty(i.itemId),food=i.category==='food',q=food?qtyOf(i.itemId):1,unit=i.discount>0?i.salePrice:i.price,cost=unit*q;let btn,qsel='';
  if(food)qsel='<div class="qty" role="group" aria-label="購買數量"><button aria-label="減少" onclick="setQty(\''+i.itemId+'\','+(q-1)+')"'+(q<=1?' disabled':'')+'>−</button><span class="qn" aria-live="polite">'+q+'</span><button aria-label="增加" onclick="setQty(\''+i.itemId+'\','+(q+1)+')"'+(q>=10?' disabled':'')+'>+</button></div>';
  if(!food&&own)btn='<button disabled>已擁有</button>';
  else if(P.pet.level<i.requiredLevel)btn='<button disabled>'+ic('lock',16)+' Lv.'+i.requiredLevel+' 解鎖</button>';
  else if(P.balance<cost)btn='<button disabled>金幣不足'+(q>1?'（需 '+cost+'）':'')+'</button>';
  else btn=confirmId===i.itemId?'<button class="ok" onclick="buy(\''+i.itemId+'\')">再按一次確認'+(q>1?' ×'+q+'（'+cost+' 金幣）':'')+'</button>':'<button class="pri" onclick="confirmId=\''+i.itemId+'\';render()">購買'+(q>1?' ×'+q:'')+'</button>';
  return '<div class="card item"><div class="th">'+thumb(i)+ltdBadge(i)+offTag(i)+'</div><b>'+esc(i.name)+'</b><div class="meta">'+ic('coin',14)+' '+priceHtml(i)+(food?'・+'+i.expGain+' 經驗'+(i.weightGain?'・+'+i.weightGain+' 公斤':'')+(own?'・持有 '+own:''):'')+'</div>'+ltdLine(i)+qsel+btn+'</div>';
}
function buy(id){act(async function(){const it=P.items.filter(function(x){return x.itemId===id})[0],q=(it&&it.category==='food')?qtyOf(id):1;setP(await call('buy',{itemId:id,qty:q}));confirmId='';delete buyQty[id];const _b=P.bought;toast(q>1?'購買成功！已買 '+q+' 個':(_b?'購買成功！獲得 '+_b.exp+' 經驗'+(_b.bonus?'，滿 '+(P.buyRule?P.buyRule.every:5)+' 件加碼 +'+_b.bonus:''):'購買成功！'));
    if(_b&&_b.leveledUp){levelMsg=ic('star',20)+' 太棒了！'+esc(P.pet.name)+' 升級為 Lv.'+_b.newLevel+' '+esc(_b.stageName)+'！';setTimeout(function(){levelMsg='';if(me)render()},5000)}
    render()})}

/* ---------- 背包 ---------- */
function bagTab(){
  const e=P.pet.equipped,mine=function(c){return P.items.filter(function(i){return i.category===c&&invQty(i.itemId)>0})};
  const costumes=mine('costume'),bgs=mine('background'),furs=mine('furniture');
  let h='<div class="card sc" style="max-width:520px;margin:0 auto 12px">'+sceneOf()+'</div>';
  h+='<h3 class="sec">服裝造型</h3>'+(costumes.length?'<div class="grid4">'+costumes.map(function(i){
    const on=e[i.slot]===i.itemId;
    return '<div class="card item"><div class="th">'+thumb(i)+ltdBadge(i)+'</div><b>'+esc(i.name)+'</b><div class="meta">'+(SLOTN[i.slot]||'')+'</div><button class="'+(on?'':'pri')+'" onclick="equip(\''+i.itemId+'\',\''+i.slot+'\','+on+')">'+(on?'卸下':'穿上')+'</button></div>';
  }).join('')+'</div>':'<div class="meta">尚無服裝，快去商店逛逛吧！</div>');
  const curBg=P.pet.backgroundId||'';
  h+='<h3 class="sec">背景場景</h3><div class="grid4">'+[{itemId:'',name:'預設房間',category:'background',drawKey:'bg_none'}].concat(bgs).map(function(i){
    const on=curBg===i.itemId;
    return '<div class="card item"><div class="th">'+thumb(i)+ltdBadge(i)+'</div><b>'+esc(i.name)+'</b><button class="'+(on?'':'pri')+'" '+(on?'disabled':'')+' onclick="setBg(\''+i.itemId+'\')">'+(on?'使用中':'套用')+'</button></div>';
  }).join('')+'</div>';
  const placed={};P.layout.forEach(function(l){placed[l.itemId]=true});

const ST={assigned:'待完成',submitted:'待審核',approved:'已通過',rejected:'已退回',assignee_rejected:'執行者已拒絕',cancelled:'已取消'};

function taskListView(){
  let filtered = tasks;
  if(taskFilter === 'assigned_to_me'){
    filtered = tasks.filter(t => t.assigneeId === me.userId);
  } else if(taskFilter === 'created_by_me'){
    filtered = tasks.filter(t => t.createdById === me.userId);
  }

  const filterBtns = [
    ['all', '全部任務'],
    ['assigned_to_me', '派給我的任務'],
    ['created_by_me', '自己派出的任務']
  ];

  let h = '<div class="tabs sub" style="margin-bottom:12px;">' +

    '</div>';

function setTaskFilter(f){
  taskFilter = f;

function cbtn(key,fn,label,confirmLabel,confirmCls,idleCls){
  return cancelAsk===key?'<button class="'+(confirmCls||'no')+'" onclick="'+fn+'">'+confirmLabel+'</button>':'<button'+(idleCls?' class="'+idleCls+'"':'')+' onclick="'+fn+'">'+label+'</button>';
}
function keepRender(){const v={};document.querySelectorAll('#app textarea,#app input,#app select').forEach(function(e){if(e.id)v[e.id]=e.value});render();Object.keys(v).forEach(function(k){const e=$(k);if(e)e.value=v[k]})}
function askOnce(key){if(cancelAsk===key){cancelAsk='';return false}cancelAsk=key;keepRender();return true}
function taskCard(t){
  let a='';
  const isAssignee=(t.assigneeId===me.userId);
  const isCreator=(t.createdById===me.userId);
  const isParent=(me.role==='parent');
  const isSelfAssigned = isAssignee;
  const cardClass = isSelfAssigned ? 'card self-task' : 'card';
  const selfBadge = isSelfAssigned ? '<span class="b self-badge">派給自己</span>' : '';

  if(isAssignee){
    if(t.status==='assigned'||t.status==='rejected'){
      a+='<textarea id="nt_'+t.taskId+'" rows="2" placeholder="想跟指派者說的話（選填）"></textarea>'+
         '<div class="row"><button class="ok" onclick="submitTask(\''+t.taskId+'\')">完成並提交任務！</button></div>';
      a+='<textarea id="rj_'+t.taskId+'" rows="2" placeholder="拒絕理由（拒絕時必須填寫）" style="margin-top:8px"></textarea>'+
         '<div class="row">'+cbtn('rj_'+t.taskId,'rejectTaskAssignee(\''+t.taskId+'\')','拒絕此任務','再按一次確認拒絕')+'</div>';
    }
  }

  if(isCreator){
    if(t.status==='submitted'){
      a+='<textarea id="rs_'+t.taskId+'" rows="2" placeholder="退回原因（退回時必須填寫）"></textarea>'+
         '<div class="row"><button class="ok" onclick="review(\''+t.taskId+'\',true)">審核通過</button><button class="no" onclick="review(\''+t.taskId+'\',false)">退回修改</button></div>';
    }
    if(t.status==='assignee_rejected'){
      a+='<div class="row">'+cbtn('ag_'+t.taskId,'reviewReject(\''+t.taskId+'\',true)','同意中止任務','再按一次確認中止')+'<button class="no" onclick="reviewReject(\''+t.taskId+'\',false)">否決（要求繼續執行）</button></div>';
    }
    if(['assigned','rejected','submitted','assignee_rejected'].indexOf(t.status)>=0){
      a+='<div class="row">'+cbtn('c_'+t.taskId,'cancelTask(\''+t.taskId+'\')','取消任務','再按一次確認取消')+'</div>';
    }
  }

  if(isParent && !isCreator && ['assigned','rejected','submitted','assignee_rejected'].indexOf(t.status)>=0){
    a+='<textarea id="fc_'+t.taskId+'" rows="2" placeholder="強制中止理由（家長身分必填）" style="margin-top:8px"></textarea>'+
       '<div class="row">'+cbtn('fc_'+t.taskId,'forceCancelTask(\''+t.taskId+'\')','家長強制中止','再按一次確認強制中止')+'</div>';
  }

  return '<div class="'+cardClass+'"><div class="top"><b>'+esc(t.title)+'</b><div><span class="b '+t.status+'">'+(ST[t.status]||t.status)+'</span>'+selfBadge+'</div></div>'+
  (t.description?'<div>'+esc(t.description)+'</div>':'')+
  '<div class="meta">執行者：'+esc(t.assigneeName)+' ・ 發起人：'+esc(t.createdByName||'家人')+'<br>'+ic('coin',14)+' 獎勵：'+t.reward+' 金幣'+(t.dueDate?' ・ 期限：'+esc(String(t.dueDate).slice(0,10)):'')+'</div>'+
  (t.submitNote?'<div class="meta" style="color:var(--ok)"><b>執行留言：</b>'+esc(t.submitNote)+'</div>':'')+
  (t.rejectReason?'<div class="warn"><b>相關備註/理由：</b>'+esc(t.rejectReason)+'</div>':'')+a+'</div>';
}

function submitTask(id){act(async()=>{const d=await call('submitTask',{taskId:id,note:$('nt_'+id).value});toast('已成功提交任務！');tasks=d.tasks;fresh.tasks=Date.now();render()})}
function rejectTaskAssignee(id){if(!$('rj_'+id).value.trim()){toast('拒絕任務必須填寫理由',true);return}if(askOnce('rj_'+id))return;act(async()=>{const d=await call('rejectTaskAssignee',{taskId:id,reason:$('rj_'+id).value});toast('已拒絕此任務');tasks=d.tasks;fresh.tasks=Date.now();render()})}

function reviewReject(id,agree){if(agree&&askOnce('ag_'+id))return;cancelAsk='';act(async()=>{const d=await call('reviewReject',{taskId:id,agree:agree});toast(agree?'已同意中止任務':'已否決，任務將繼續進行');tasks=d.tasks;fresh.tasks=Date.now();render()})}
function cancelTask(id){
  if(askOnce('c_'+id))return;
  act(async()=>{const d=await call('cancelTask',{taskId:id});toast('任務已取消');tasks=d.tasks;fresh.tasks=Date.now();render()});
}
function forceCancelTask(id){if(!$('fc_'+id).value.trim()){toast('強制中止必須填寫理由',true);return}if(askOnce('fc_'+id))return;act(async()=>{const d=await call('forceCancelTask',{taskId:id,reason:$('fc_'+id).value});toast('已由家長強制中止任務');tasks=d.tasks;fresh.tasks=Date.now();render()})}

<script>
/* 自動更新：每次發佈新版請把 APP_VERSION 改成不同的值（例如日期）。使用者開啟或回到 App 時，會偷偷檢查線上版本，不同就自動重新載入 */
const APP_VERSION='2026-11-13.1';
function checkUpdate(){
  try{
    fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
      const m=/const APP_VERSION='([^']+)'/.exec(t);
      if(!m||m[1]===APP_VERSION)return;
      if(feeding||pending>0)return;
      const k='upd_'+m[1];
      try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){}
      location.reload();
    }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')checkUpdate()});
setTimeout(checkUpdate,1500);
let token=lsGet('tk'),me=null,tab='pet',tasks=[],members=[],fresh={},regMode=false,pending=0;
const $=id=>document.getElementById(id);
function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function busy(d){pending=Math.max(0,pending+d);$('loading').className=pending>0?'on':''}
async function call(a,p,quiet){
  if(!API_URL)throw new Error('尚未設定後端網址：請在 config.js 填入 API_URL');
  if(!quiet)busy(1);
  try{
    let r;
    try{
      const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:a,payload:p||{},token:token})});
      r=await res.json();
    }catch(e){throw new Error('無法連線到伺服器，請檢查網路後再試')}
    if(r&&r.newToken){token=r.newToken;lsSet('tk',token)}
    if(r&&r.ok)return r.data;
    throw new Error((r&&r.error)||'伺服器沒有回應');
  }finally{if(!quiet)busy(-1)}
}
function toast(m,err){const t=$('toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',3000)}

  const steps=D[k].map(function(s,n){return '<div class="card" style="display:flex;gap:12px;align-items:flex-start"><span class="chip" style="flex:none;width:32px;height:32px;padding:0;justify-content:center">'+(n+1)+'</span><div><b>'+s[0]+'</b><div class="meta" style="margin:2px 0 0">'+s[1]+'</div></div></div>'}).join('');

  '<div class="meta" style="margin-bottom:10px">把樂園加到桌面，之後點圖示就能直接打開。請選擇你使用的裝置：</div>'+tabs+steps+
  '<div class="meta" style="margin:6px 0 10px">小提醒：桌面圖示和瀏覽器的登入狀態是分開的，第一次從桌面打開時要登入一次，之後就會記住。</div>'+
  '<div class="row"><button class="pri" onclick="closeHelp()">我知道了</button></div>';

async function ensure(k,force){
  if(k==='family'||k==='new')k='members';
  if(!force&&fresh[k]&&Date.now()-fresh[k]<20000)return;
  const mapAct={tasks:['listTasks',d=>tasks=d],members:['listMembers',d=>members=d],coins:['listCoins',d=>coinList=d]};
  if(mapAct[k]){
    const actInfo=mapAct[k];
    actInfo[1](await call(actInfo[0]));
    fresh[k]=Date.now();
  }
}

function render(){
  $('hd').innerHTML='<h1>'+ic('cat',28)+' 家事寵物樂園</h1><div class="who"><span class="chip">'+ic('coin',16)+' '+me.balance+'</span><span>'+esc(me.name)+'（'+(me.role==='parent'?'家長':'小孩')+'）</span><button onclick="showHelp()" aria-label="使用說明">'+ic('help',18)+'</button><button onclick="reload()" aria-label="重新整理">'+ic('refresh',18)+'</button><button onclick="logout()">登出</button></div>';
  $('app').innerHTML=helpOpen?helpHtml():mainHtml();
}
function reload(){act(async()=>{const t=tab,d=await call('boot',{});me=d.me;tasks=d.tasks||[];P=d.pet;me.balance=P?P.balance:0;tab=t;fresh={tasks:Date.now()};if(['coins','family','new'].indexOf(t)>=0)await ensure(t,true);render()})}

if(token){boot().catch(()=>logout())}else{authView();call('config').then(function(c){const v=String(c.showCreateFamily);if(v!==CFG.showCreateFamily){CFG.showCreateFamily=v;if(!me&&!token)authView()}}).catch(function(){})}
</script>
</body>
</html>
